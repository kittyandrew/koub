[package]
name = "open-uptime-bot"
version = "2026.3.23"
edition = "2024"

# I have no clue what any of this does:
[profile.release]
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
lto = "fat"

[dependencies]
rocket = { git = "https://github.com/rwf2/Rocket", rev = "3a54d079aef060a8f732bd04ea54b0581a604087", features = ["json", "uuid"] }
diesel-async = { version = "0.9.0", features = ["postgres", "bb8"] }
diesel = { version = "2.3.10", features = ["postgres", "uuid"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
prometheus = { version = "0.14", features = ["nightly"] }
uuid = { version = "1.11.0", features = ["v4", "fast-rng", "serde"] }
reqwest = { version = "0.12.9", features = ["json"] }
fluent-templates = "0.11.0"
lazy_static = "1.5.0"
unic-langid = "0.9.5"
fluent = "0.16.1"
dotenv = "0.15.0"
chbs = "0.1.1"
rand = "0.8.5"
governor = "0.7.0"
dashmap = "6.1.0"
